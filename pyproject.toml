[project]
name = "lunchbot"
version = "1.0.0"
description = "Bot that posts the DESY canteen lunch menu to Mattermost"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "openai",
    "pillow",
    "python-dotenv",
    "pyyaml",
    "requests",
]

[project.scripts]
lunchbot = "scripts.run_lunchbot:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
